name: EDX release

# Dispara com uma tag "edx-<versão upstream>-<revisão EDX>", ex.: edx-1.4.9-1
# ou manualmente pela aba Actions. As tags do upstream (1.4.9, nightly) não
# casam com este padrão, então os workflows originais não interferem.
on:
  push:
    tags:
      - "edx-*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Qual app gerar"
        type: choice
        options: [suporte, tecnico]
        default: suporte

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/edx-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_type == 'tag' && github.ref_name || format('edx-dev-{0}', github.run_number) }}
      flavor: ${{ inputs.flavor || 'suporte' }}

  # Renomeia os pacotes (rustdesk-* -> <App>-*) e publica o código-fonte
  # completo, com submódulos, ao lado dos binários (AGPL-3.0, seção 6).
  finalize:
    needs: build
    runs-on: ubuntu-22.04
    # Os secrets da Certum ficam no ambiente "signing": com revisores
    # obrigatórios configurados, nada é assinado sem aprovação humana.
    environment: signing
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('edx-dev-{0}', github.run_number) }}
      FLAVOR: ${{ inputs.flavor || 'suporte' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve app name
        run: |
          APP=$(python3 -c "import json,os;b=json.load(open('edx/brand.json',encoding='utf-8'));print(b['flavors'][os.environ['FLAVOR']]['app_name'])")
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Rename release assets
        run: |
          mkdir -p dl out
          gh release download "$TAG" -D dl --repo "$GITHUB_REPOSITORY"
          for f in dl/*; do
            b=$(basename "$f")
            # O app do cliente é só portátil: descarta instaladores.
            if [ "$FLAVOR" = "suporte" ] && echo "$b" | grep -Eq '\.(msi|deb|rpm|zst)$'; then
              gh release delete-asset "$TAG" "$b" --yes --repo "$GITHUB_REPOSITORY"
              continue
            fi
            # Nomes fixos (sem versão) para os portáteis: assim o link
            # .../releases/latest/download/<App>-<arq>.<ext> sempre aponta
            # para a versão mais recente. A versão fica no nome da release.
            arch=$(echo "$b" | grep -oE 'x86_64|aarch64' | head -1)
            ext="${b##*.}"
            if [ -n "$arch" ] && echo "$ext" | grep -Eq '^(exe|dmg|AppImage)$'; then
              n="${APP}-${arch}.${ext}"
            else
              n=$(echo "$b" | sed -E "s/^[Rr]ust[Dd]esk/${APP}/")
            fi
            mv "$f" "out/$n"
            if [ "$n" != "$b" ]; then
              gh release delete-asset "$TAG" "$b" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done
          ls -l out

      - name: Check code-signing credentials
        id: signcfg
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          EDX_SIGN_PFX_B64: ${{ secrets.EDX_SIGN_PFX_B64 }}
        run: |
          certum=false; internal=false
          [ -n "$CERTUM_EMAIL" ] && [ -n "$CERTUM_OTP" ] && certum=true
          [ -n "$EDX_SIGN_PFX_B64" ] && internal=true
          echo "enabled=$certum" >> "$GITHUB_OUTPUT"
          echo "internal=$internal" >> "$GITHUB_OUTPUT"
          if [ "$certum" = false ] && [ "$internal" = false ]; then
            echo "::warning title=Assinatura de código::nenhuma credencial no ambiente 'signing'; executáveis Windows publicados SEM assinatura."
          fi

      # Assina antes do SHA256SUMS e do upload, para que checksums e
      # downloads correspondam ao binário assinado.
      - name: Sign Windows executables (Certum SimplySign)
        if: steps.signcfg.outputs.enabled == 'true'
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          cargo install ssign --version 0.1.1 --locked
          shopt -s nullglob
          exes=(out/*.exe)
          [ ${#exes[@]} -gt 0 ] || { echo "nenhum .exe para assinar"; exit 0; }
          ssign "${exes[@]}"
          sudo apt-get install -y -qq osslsigncode > /dev/null
          for f in "${exes[@]}"; do
            echo "== $f"
            out=$(osslsigncode verify -in "$f" 2>&1 || true)
            echo "$out" | grep -E "Subject:|Issuer:|Timestamp|Signature verification" || true
            if echo "$out" | grep -qi "No signature found"; then
              echo "::error title=Assinatura de código::$f ficou sem assinatura"; exit 1
            fi
          done

      # Certificado emitido pela CA interna da EDX. Só é confiável onde a raiz
      # EDX foi distribuída (GPO/Intune). Se a Certum também assinou, esta
      # entra como assinatura aninhada.
      - name: Sign Windows executables (CA interna EDX)
        if: steps.signcfg.outputs.internal == 'true'
        env:
          EDX_SIGN_PFX_B64: ${{ secrets.EDX_SIGN_PFX_B64 }}
          EDX_SIGN_PFX_PASS: ${{ secrets.EDX_SIGN_PFX_PASS }}
          EDX_SIGN_CHAIN: ${{ vars.EDX_SIGN_CHAIN }}
        run: |
          sudo apt-get install -y -qq osslsigncode > /dev/null
          shopt -s nullglob
          exes=(out/*.exe)
          [ ${#exes[@]} -gt 0 ] || { echo "nenhum .exe para assinar"; exit 0; }
          bash edx/scripts/sign_internal.sh "${exes[@]}"
          for f in "${exes[@]}"; do
            osslsigncode verify -in "$f" 2>&1 | grep -E "Number of signatures|Subject: /CN" | sort -u || true
          done

      - name: Build corresponding-source tarball
        env:
          EDX_RS_PUB_KEY: ${{ vars.EDX_RS_PUB_KEY }}
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME="${APP}-${VER}-${TAG}-source"
          # Código exatamente como compilado: upstream + submódulos, já com a
          # marca aplicada, mais o kit edx/ que a gera (AGPL-3.0 §1 e §6).
          python3 edx/scripts/rebrand.py --flavor "$FLAVOR"
          tar --exclude=.git --exclude=./dl --exclude=./out \
              --transform "s,^\.,${NAME}," -czf "out/${NAME}.tar.gz" .
          cp LICENCE out/LICENCE.txt
          cp EDX-NOTICE.md out/EDX-NOTICE.md
          (cd out && sha256sum * > SHA256SUMS.txt)

      - name: Upload renamed assets
        run: |
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file edx/RELEASE_NOTES.md \
            --title "${APP} ${VER} (${TAG})"
